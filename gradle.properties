# The memory available to Gradle: the build configures a project per release (versions/README.md), 25 in all.
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# The development version (runClient): any release in versions/versions.txt of the newest family. The Minecraft,
# loader and Fabric API versions of every release are in that table (versions/README.md).
dev_version=26.1.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=0.8.0
maven_group=ai.rrw.kine
